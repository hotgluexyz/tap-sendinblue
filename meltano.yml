version: 1
send_anonymous_usage_stats: true
project_id: tap-sendinblue
default_environment: dev
environments:
- name: dev
- name: staging
- name: prod
plugins:
  extractors:
  - name: tap-sendinblue
    namespace: tap_sendinblue
    executable: ./tap-sendinblue.sh
    capabilities:
    - state
    - catalog
    - discover
    settings:
    - name: api_key
      kind: password
      sensitive: true
    - name: start_date
      value: '2010-01-01T00:00:00Z'
    config:
      start_date: '2024-01-01'
    select:
    - lists.*
    - campaigns.*
    - sms_campaigns.*
  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
